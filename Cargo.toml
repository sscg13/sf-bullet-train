[package]
name = "sf-bullet-train"
version = "0.1.0"
edition = "2021"

[features]
default = ["cuda"]
cuda = ["bullet/cuda"]
cpu = ["bullet/cpu"]

[dependencies]
bullet = { git = "https://github.com/jw1912/bullet", package = "bullet_lib", rev = "e37db79ee3ee54be2a2f310004b1b82f3b60c0ca", default-features = false }
bulletformat = "1.7.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
